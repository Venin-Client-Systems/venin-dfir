name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 12
            --allowedTools Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(cargo fmt:*),Bash(cargo build:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo metadata:*),Bash(scripts/check.sh:*),Bash(scripts/make_sample_datasets.sh:*),Bash(sqlite3:*),Bash(shasum:*)
            --system-prompt "You are working on VENIN DFIR, a Rust-first digital forensics toolkit. Preserve forensic soundness, deterministic parsing, raw evidence values, UTC timestamp normalization, and CLI-first workflows. Do not add GUI-first features. Do not commit real personal evidence or secrets."
